services:
  origin:
    build: ./origin
    environment:
      ORIGIN_DATA_DIR: /data
      ORIGIN_VIDEO_SIZE: "1048576"
    volumes:
      - origin-data:/data
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    build: ./proxy
    depends_on:
      origin:
        condition: service_healthy
    environment:
      ORIGIN_BASE: http://origin:8080
      ORIGIN_VIDEO_PATH: /video
      CACHE_DIR: /data/cache
      CACHE_MAX_VERSIONS: "3"
      FETCH_MAX_RETRIES: "3"
      HTTP_TIMEOUT: "10"
    volumes:
      - proxy-cache:/data/cache
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  origin-data:
  proxy-cache:
